<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>CapCut Auto Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0b0f19;
    color: #e8e8f0;
    width: 320px;
    padding: 12px;
    font-size: 12px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
  }
  .label {
    font-size: 10px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 5px;
    display: block;
  }
  input {
    width: 100%;
    height: 38px;
    background: #111a2e;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 0 10px;
    font-size: 12px;
    color: #f1f5f9;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    outline: none;
    margin-bottom: 8px;
    transition: all 0.2s;
  }
  input::placeholder {
    color: #64748b;
    font-size: 11px;
  }
  input:focus {
    border-color: #00f0fe;
    box-shadow: 0 0 0 3px rgba(0, 240, 254, 0.18);
  }
  .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #00f0fe 0%, #0099ff 100%);
    color: #0b1120;
    transition: all 0.15s ease;
  }
  .btn:hover {
    filter: brightness(1.1);
  }
  .status {
    margin-top: 8px;
    font-size: 11px;
    color: #94a3b8;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M4 4H20L15 11H9L4 4Z" fill="#FFF"/>
      <path d="M9 13H15L20 20H4L9 13Z" fill="#00F0FE"/>
    </svg>
    <h1>CapCut Auto Login</h1>
  </div>

  <span class="label">⚡ DÁN EMAIL [TAB] PASS:</span>
  <input type="text" id="inp" placeholder="email	pass hoặc email|pass" autofocus spellcheck="false" autocomplete="off" />
  <button class="btn" id="btn">🚀 MỞ & ĐĂNG NHẬP</button>
  <div class="status" id="status">Dán acc rồi bấm Đăng nhập</div>

  <script src="popup.js"></script>
</body>
</html>
